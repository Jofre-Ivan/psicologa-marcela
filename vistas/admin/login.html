<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Lic. Marcela Rolón</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos/base.css">
    <link rel="stylesheet" href="/estilos/componentes.css">
    <link rel="stylesheet" href="/estilos/layout.css">
</head>
<body>

    <main class="login-contenedor">
        <div class="tarjeta login-tarjeta">
            <div class="texto-centrado mb-3">
                                <a href="/" class="logo">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
                        <defs>
                            <linearGradient id="grad-logo" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#5a7d63"/>
                                <stop offset="100%" stop-color="#c4a287"/>
                            </linearGradient>
                        </defs>
                        <circle cx="24" cy="24" r="21" fill="url(#grad-logo)" stroke="currentColor" stroke-width="1.5" opacity="0.12"/>
                        <path d="M24 8.5 C15 8.5 8.5 15 8.5 24 C8.5 33 15 39.5 24 39.5 C33 39.5 39.5 33 39.5 24 C39.5 15 33 8.5 24 8.5 Z" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.18"/>
                        <path d="M29.5 18.5 C30 19.8 29.8 21.2 29 22.3 C28.2 23.5 27 24 26 24 C25 24 24 23.8 23 23.5 C22 23.2 21 22.5 20.5 21.3 C20 20 20.5 18.5 21.5 17.5 C22.8 16.3 24.5 16.2 26 16.5 C27.3 16.7 28.5 17.5 29.5 18.5 Z" fill="currentColor" opacity="0.75"/>
                        <path d="M17.5 28.5 C19 29 21 28 23 27.5 C25 27 27 27.5 28.5 28.5 C30 29.5 30.5 31 30 32.5 C29.5 34 28 34.5 26.5 34.5 C25 34.5 23.5 34 22 33.5 C20.5 33 19 32.5 17.5 31.5 C16 30.5 15.5 29.5 16 28.5 C16.5 27.5 17 27.5 17.5 28.5 Z" fill="currentColor" opacity="0.85"/>
                        <circle cx="24" cy="24" r="2.2" fill="white" opacity="0.9"/>
                    </svg>
                    Marcela <span>Rolón</span>
                </a>
                <p class="texto-suave mt-1">Panel de administración</p>
            </div>
            <form id="form-login">
                <div class="campo mb-2">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="campo mb-2">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <div class="campo mb-2">
                    <label for="totp">Código 2FA (Google Authenticator)</label>
                    <input type="text" id="totp" required pattern="[0-9]{6}" maxlength="6" placeholder="000000" autocomplete="one-time-code">
                </div>
                <button type="submit" class="boton boton-primario btn-completo">Ingresar</button>
            </form>
            <div id="mensaje-login" class="mt-2"></div>
        </div>
    </main>

    <script src="/scripts-js/login-admin.js"></script>
</body>
</html>
