<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel — Lic. Marcela Rolón</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos/base.css">
    <link rel="stylesheet" href="/estilos/componentes.css">
    <link rel="stylesheet" href="/estilos/layout.css">
    <link rel="stylesheet" href="/estilos/admin.css">
</head>
<body>

    <header class="navbar">
        <div class="contenedor nav-interno">
            <a href="/admin/panel" class="logo">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
                    <defs>
                        <linearGradient id="grad-logo" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#5a7d63"/>
                            <stop offset="100%" stop-color="#c4a287"/>
                        </linearGradient>
                    </defs>
                    <circle cx="24" cy="24" r="21" fill="url(#grad-logo)" stroke="currentColor" stroke-width="1.5" opacity="0.12"/>
                    <path d="M24 8.5 C15 8.5 8.5 15 8.5 24 C8.5 33 15 39.5 24 39.5 C33 39.5 39.5 33 39.5 24 C39.5 15 33 8.5 24 8.5 Z" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.18"/>
                    <path d="M29.5 18.5 C30 19.8 29.8 21.2 29 22.3 C28.2 23.5 27 24 26 24 C25 24 24 23.8 23 23.5 C22 23.2 21 22.5 20.5 21.3 C20 20 20.5 18.5 21.5 17.5 C22.8 16.3 24.5 16.2 26 16.5 C27.3 16.7 28.5 17.5 29.5 18.5 Z" fill="currentColor" opacity="0.75"/>
                    <path d="M17.5 28.5 C19 29 21 28 23 27.5 C25 27 27 27.5 28.5 28.5 C30 29.5 30.5 31 30 32.5 C29.5 34 28 34.5 26.5 34.5 C25 34.5 23.5 34 22 33.5 C20.5 33 19 32.5 17.5 31.5 C16 30.5 15.5 29.5 16 28.5 C16.5 27.5 17 27.5 17.5 28.5 Z" fill="currentColor" opacity="0.85"/>
                    <circle cx="24" cy="24" r="2.2" fill="white" opacity="0.9"/>
                </svg>
                Marcela <span>Rolón</span>
            </a>
            <div class="nav-acciones">
                <a href="/" class="boton-secundario boton-chico">Ver sitio</a>
                <button class="boton-secundario boton-chico" id="cerrar-sesion">Salir</button>
            </div>
        </div>
    </header>

    <main>
        <section class="seccion">
            <div class="contenedor">
                <h2 class="mb-3">Panel de administración</h2>

                <!-- Estadísticas -->
                <div class="grilla grilla-4 mb-3" id="estadisticas">
                    <div class="tarjeta">
                        <p class="texto-suave">Turnos Totales</p>
                        <p id="stat-turnos" class="contador">0</p>
                    </div>
                    <div class="tarjeta">
                        <p class="texto-suave">Confirmados</p>
                        <p id="stat-confirmados" class="contador texto-exito">0</p>
                    </div>
                    <div class="tarjeta">
                        <p class="texto-suave">Cancelados</p>
                        <p id="stat-cancelados" class="contador texto-peligro">0</p>
                    </div>
                    <div class="tarjeta">
                        <p class="texto-suave">Ingresos</p>
                        <p id="stat-ingresos" class="contador">$0</p>
                    </div>
                </div>

                <!-- Agenda semanal -->
                <div class="tarjeta mb-3">
                    <h3 class="mb-2">Agenda semanal</h3>
                    <p class="texto-suave mb-2">Habilitá los días y configurá los horarios de atención.</p>
                    <div id="editor-agenda" class="agenda-editor"></div>
                    <button class="boton boton-primario mt-3" id="guardar-agenda">Guardar cambios</button>
                    <div id="mensaje-agenda" class="mt-2"></div>
                </div>

                <!-- Filtro -->
                <div class="tarjeta mb-3">
                    <label for="filtro" class="filtro-label">Filtrar por estado:</label>
                    <select id="filtro" class="filtro-select">
                        <option value="todos">Todos</option>
                        <option value="pendiente_verificacion">Pendiente Verificación</option>
                        <option value="pendiente_pago">Pendiente Pago</option>
                        <option value="confirmado">Confirmado</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>

                <!-- Tabla de turnos -->
                <div class="tarjeta" style="overflow-x:auto">
                    <table id="tabla-turnos">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Servicio</th>
                                <th>Cobertura</th>
                                <th>Monto</th>
                                <th>Paciente</th>
                                <th>Teléfono</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-turnos"></tbody>
                    </table>
                    <p id="sin-turnos" class="texto-suave texto-centrado" style="padding:32px;display:none">No hay turnos.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/scripts-js/admin.js"></script>
</body>
</html>
